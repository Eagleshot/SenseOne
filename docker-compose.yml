services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_DATA_DIR: /app/data
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      APP_AUTH_EMAIL: ${APP_AUTH_EMAIL:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      APP_REQUIRE_HTTPS: ${APP_REQUIRE_HTTPS:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      # Trust X-Forwarded-* only from inside this compose network (nginx +
      # cloudflared). Never "*": that lets any client spoof the scheme/IP and
      # bypass HTTPS enforcement and the login throttle. Keep in sync with the
      # senseone network subnet pinned below.
      FORWARDED_ALLOW_IPS: ${APP_FORWARDED_ALLOW_IPS:-172.28.0.0/16}
      # Control-plane data is a SQLite file on the data volume (under APP_DATA_DIR),
      # so it persists across restarts alongside the image blobs. No DB server.
    # Bind to loopback so the backend is reachable for local dev / docs but never
    # directly from the internet (browser + device traffic go through nginx and
    # the Cloudflare tunnel). For a strict tunnel-only prod box, drop this block
    # entirely so only cloudflared can reach backend:3000.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/data:/app/data
    networks:
      - senseone

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - senseone

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - senseone

networks:
  senseone:
    driver: bridge
    # Subnet is pinned so FORWARDED_ALLOW_IPS above can name it deterministically.
    # Only the services in this file (nginx, cloudflared) sit on it, so trusting
    # this range for proxy headers is safe; nothing else can originate from it.
    ipam:
      config:
        - subnet: 172.28.0.0/16
