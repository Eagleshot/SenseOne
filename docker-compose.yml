services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_DATA_DIR: /app/data
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      APP_AUTH_TOKEN_TTL_SECONDS: ${APP_AUTH_TOKEN_TTL_SECONDS:-43200}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/data:/app/data
    networks:
      - senseone

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - senseone

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - senseone

networks:
  senseone:
    driver: bridge
