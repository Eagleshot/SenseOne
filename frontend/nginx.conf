server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Preserve the scheme the browser used at Cloudflare's edge (Cloudflare
        # sets X-Forwarded-Proto). Using $scheme would report the cloudflared->nginx
        # hop (http) and make the backend 426 HTTPS traffic when APP_REQUIRE_HTTPS=true.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
